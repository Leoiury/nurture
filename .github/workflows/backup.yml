name: Backup

# Backup diário da produção, criptografado, no Google Drive (scripts/backup.sh).
# Sem gatilho de PR: os secrets e o banco só são usados aqui. Nunca usar
# upload-artifact neste workflow: os artefatos de um repositório público são abertos.
on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  actions: write # reativar o agendamento, abaixo

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age rclone
      - run: bash scripts/backup.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_DESTINO: drive:nurture-backups
          RCLONE_CONFIG_DRIVE_TYPE: drive
          RCLONE_CONFIG_DRIVE_SCOPE: drive.file
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      - run: bash scripts/backup-arquivos.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_DESTINO: drive:nurture-backups
          RCLONE_CONFIG_DRIVE_TYPE: drive
          RCLONE_CONFIG_DRIVE_SCOPE: drive.file
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      # O GitHub pausa agendamentos após 60 dias sem atividade no repositório.
      - if: always()
        run: gh workflow enable backup.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
